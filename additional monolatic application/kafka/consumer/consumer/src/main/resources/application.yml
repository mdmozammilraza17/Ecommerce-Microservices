spring:
  application:
    name: consumer

  cloud:
    function:
      definition: sendRiderLocation;processRiderStatus

    stream:
      bindings:
        processRiderLocation-in-0:
          destination: my-topic
          content-type: application/json

        processRiderStatus-in-0:
          destination: new-topic
          content-type: application/json

    kafka:
      binder:
        brokers: localhost:9092

